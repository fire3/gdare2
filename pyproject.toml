[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gdare2"
dynamic = ["version"]
description = "radare2-style CLI backed by Ghidra and PyGhidra"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fire3" }]
keywords = [
    "binary-analysis",
    "disassembler",
    "ghidra",
    "pyghidra",
    "radare2",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Utilities",
]
dependencies = ["pyghidra>=3.2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gdare2 = "gdare2.cli:main"
gdare2d = "gdare2d.__main__:main"

[project.urls]
Homepage = "https://github.com/fire3/gdare2"
Repository = "https://github.com/fire3/gdare2"
Issues = "https://github.com/fire3/gdare2/issues"
Changelog = "https://github.com/fire3/gdare2/blob/main/CHANGELOG.md"
Documentation = "https://github.com/fire3/gdare2/blob/main/docs/README.md"

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.6",
    "twine>=6",
]

[tool.hatch.version]
path = "src/gdare2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gdare2", "src/gdare2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not real_ghidra and not parity and not arch_matrix'"
markers = [
    "real_ghidra: requires Ghidra + PyGhidra",
    "parity: requires radare2",
    "arch_matrix: imports one raw binary per architecture",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
prerelease = "allow"
